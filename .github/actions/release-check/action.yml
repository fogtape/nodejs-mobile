name: Release check
description: >
  Validate explicit manual prerelease requests against the maintained branch,
  upstream pin, version header, reviewed release marker and unused tags.
  PR/push builds never publish. Run before materializing the recipe checkout.
inputs:
  operation:
    description: build, prerelease-dryrun or prerelease
    default: build
  version:
    description: Exact mobile version required for manual prerelease requests
    default: ''
  token:
    description: Token with contents:read on this repository, for the tag probe.
    required: true
outputs:
  release:
    description: '"true" for an explicit validated manual prerelease request.'
    value: ${{ steps.d.outputs.release }}
  dryrun:
    description: '"true" for a validated manual prerelease-dryrun request.'
    value: ${{ steps.d.outputs.dryrun }}
  cold:
    description: >
      '"true" when this run is on the publish path (a real release OR a
      rehearsal) and must therefore compile without any shared cache. A
      rehearsal that built warm would not be rehearsing the release.'
    value: ${{ steps.d.outputs.cold }}
  version:
    description: The version of record, X.Y.Z-R.
    value: ${{ steps.d.outputs.version }}
runs:
  using: composite
  steps:
    - id: d
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        RELEASE_OPERATION: ${{ inputs.operation }}
        RELEASE_VERSION: ${{ inputs.version }}
      run: python3 scripts/release-control.py check
