name: Cut release
run-name: Plan prerelease ${{ inputs.version }} · ${{ inputs.release_line }} · ${{ inputs.operation }}

# This workflow prepares a reviewed release PR; it never tags or publishes.
# The explicit target line is independent of the workflow-definition branch.
on:
  workflow_dispatch:
    inputs:
      release_line:
        description: Target Node version line (26 = recipe-v26, 24 = recipe)
        type: choice
        options: [recipe-v26, recipe]
        default: recipe-v26
      version:
        description: auto, upstream X.Y.Z, or exact mobile X.Y.Z-R (26.10.0-0)
        type: string
        default: auto
        required: true
      operation:
        description: Preview the plan, or open a release review PR
        type: choice
        options: [plan, prepare-pr]
        default: plan

concurrency:
  group: cut-release-${{ inputs.release_line }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  cut:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Keep the workflow's controller separate from the selected recipe line.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_line }}
          path: release-source
          fetch-depth: 1

      - name: Validate line and reserve the requested version
        id: v
        env:
          RELEASE_LINE: ${{ inputs.release_line }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/release-control.py plan --root release-source \
            --line "$RELEASE_LINE" --version "$REQUESTED_VERSION" \
            --out "$RUNNER_TEMP/release-plan.json"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'release-plan.json'
          data = json.loads(p.read_text())
          data['source_commit'] = subprocess.check_output(
              ['git', '-C', 'release-source', 'rev-parse', 'HEAD'], text=True).strip()
          p.write_text(json.dumps(data, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"## Prerelease plan\n\n"
                            f"- Line: `{data['line']}`\n"
                            f"- Source: `{data['source_commit']}`\n"
                            f"- Upstream: `{data['upstream']}`\n"
                            f"- Tag: `{data['tag']}`\n"
                            "- GitHub prerelease: **yes**, latest: **no**\n\n"
                            "Plan only: no tag, release or source mutation. "
                            "Select `prepare-pr` to create the review PR.\n")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: prerelease-plan-${{ steps.v.outputs.version }}
          path: ${{ runner.temp }}/release-plan.json
          if-no-files-found: error

      - name: Prepare header, preserve release notes, and arm manual publication
        if: inputs.operation == 'prepare-pr'
        run: |
          python3 scripts/release-control.py prepare --root release-source \
            --plan "$RUNNER_TEMP/release-plan.json"

      - name: Reconstruct the planned source checksum
        if: inputs.operation == 'prepare-pr'
        working-directory: release-source
        run: |
          SKIP_VERIFY=1 scripts/prepare.sh "$RUNNER_TEMP/matsrc"
          GOT=$(git -C "$RUNNER_TEMP/matsrc" rev-parse 'HEAD^{tree}')
          sed -i -E "s/^[0-9a-f]{40}$/${GOT}/" expected-tree.txt
          grep -E '^[0-9a-f]{40}$' expected-tree.txt

      - name: Open release review PR
        if: inputs.operation == 'prepare-pr'
        working-directory: release-source
        env:
          RELEASE_LINE: ${{ steps.v.outputs.line }}
          RELEASE_BRANCH: ${{ steps.v.outputs.release_branch }}
          V: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "nodejs-mobile-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -b "$RELEASE_BRANCH"
          git add mobile-src/src/node_mobile_version.h docs/CHANGELOG.md expected-tree.txt release-ready.txt
          git commit -m "release: prepare nodejs-mobile ${V} prerelease"
          # No force push; existing release branches are reserved in plan.
          git push origin "$RELEASE_BRANCH"
          cat > "$RUNNER_TEMP/release-pr.md" <<EOF
          Prepare **nodejs-mobile ${V}** on **${RELEASE_LINE}** for manual prerelease publication.

          - [x] The chosen version matches this line's upstream source.
          - [x] The tag/revision and release branch are unused.
          - [x] Source checksum reconstructed with prepare.sh.
          - [ ] English CHANGELOG entry and release diff reviewed.

          Existing notes for this version are preserved; fill any TODO before publication.
          Merge this PR, then run **Build** on **${RELEASE_LINE}**, choose
          **prerelease** (or **prerelease-dryrun**) and version **${V}**.
          A merge alone does not publish. Every build and device gate must pass;
          the release is a GitHub prerelease with latest=false. This mirror does
          not claim physical-device validation. See docs/RELEASING.md.
          EOF
          gh pr create --base "$RELEASE_LINE" --head "$RELEASE_BRANCH" \
            --title "release: prepare nodejs-mobile ${V} prerelease" \
            --body-file "$RUNNER_TEMP/release-pr.md"
